<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกรายรับ-รายจ่าย | FinanceFlow (Firebase Sync)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase Compat SDKs (8/9 Compat for clean browser CDN usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- External Firebase Config File -->
  <script src="firebase-config.js"></script>

  <!-- Google Fonts Prompt & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.7);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Initialize Firebase
    let firebaseInitialized = false;
    let auth = null;
    let db = null;

    try {
      if (typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY') {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        firebaseInitialized = true;
      }
    } catch (err) {
      console.warn('Firebase init error:', err);
    }

    const CATEGORIES = {
      income: [
        { id: 'salary', label: 'เงินเดือน', icon: 'wallet' },
        { id: 'freelance', label: 'ฟรีแลนซ์/งานเสริม', icon: 'laptop' },
        { id: 'investment', label: 'เงินปันผล/ลงทุน', icon: 'trending-up' },
        { id: 'other_income', label: 'อื่นๆ', icon: 'coins' },
      ],
      expense: [
        { id: 'food', label: 'อาหารและเครื่องดื่ม', icon: 'utensils' },
        { id: 'housing', label: 'ที่พักอาศัย/ค่าเช่า', icon: 'home' },
        { id: 'transport', label: 'การเดินทาง/น้ำมัน', icon: 'car' },
        { id: 'shopping', label: 'ช้อปปิ้ง/ของใช้', icon: 'shopping-bag' },
        { id: 'entertainment', label: 'ความบันเทิง', icon: 'film' },
        { id: 'bills', label: 'บิล/สาธารณูปโภค', icon: 'receipt' },
        { id: 'other_expense', label: 'อื่นๆ', icon: 'tag' },
      ]
    };

    const MONTH_NAMES = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];

    const DAY_NAMES = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

    function App() {
      // User auth state
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(firebaseInitialized);
      const [syncStatus, setSyncStatus] = useState(firebaseInitialized ? 'syncing' : 'offline');

      // Transactions
      const [transactions, setTransactions] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [filterType, setFilterType] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDate, setSelectedDate] = useState(null);

      // Active Year & Month
      const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
      const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());

      // Form state
      const [formData, setFormData] = useState({
        type: 'expense',
        title: '',
        amount: '',
        category: 'food',
        date: new Date().toISOString().split('T')[0],
        note: ''
      });

      // Listen to Auth State
      useEffect(() => {
        if (!firebaseInitialized) {
          // Fallback to localStorage if Firebase not yet configured
          const local = localStorage.getItem('money_transactions');
          if (local) setTransactions(JSON.parse(local));
          setAuthLoading(false);
          return;
        }

        const unsubscribeAuth = auth.onAuthStateChanged((currUser) => {
          setUser(currUser);
          setAuthLoading(false);
        });
        return () => unsubscribeAuth();
      }, []);

      // Realtime Firestore Listener when User is Logged In
      useEffect(() => {
        if (!user || !db) return;

        setSyncStatus('syncing');
        const userRef = db.collection('users').doc(user.uid).collection('transactions');
        
        const unsubscribe = userRef.onSnapshot(
          (snapshot) => {
            const list = [];
            snapshot.forEach(doc => {
              list.push({ id: doc.id, ...doc.data() });
            });
            setTransactions(list);
            setSyncStatus('synced');
          },
          (error) => {
            console.error('Firestore Error:', error);
            setSyncStatus('error');
          }
        );

        return () => unsubscribe();
      }, [user]);

      // Re-render Lucide icons
      useEffect(() => {
        setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 50);
      }, [transactions, isModalOpen, filterType, currentMonth, currentYear, selectedDate, user]);

      // Handle Google Sign-In
      const handleGoogleLogin = async () => {
        if (!firebaseInitialized) {
          alert('กรุณาใส่ Firebase Config ในไฟล์ firebase-config.js ก่อนครับ');
          return;
        }
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
        } catch (error) {
          console.error(error);
          alert('เข้าสู่ระบบไม่สำเร็จ: ' + error.message);
        }
      };

      const handleLogout = async () => {
        if (confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
          await auth.signOut();
          setTransactions([]);
        }
      };

      // Month Key: '2026-11'
      const currentMonthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

      // Monthly Summary
      const monthlySummary = useMemo(() => {
        let income = 0;
        let expense = 0;
        let count = 0;

        transactions.forEach(t => {
          if (t.date && t.date.startsWith(currentMonthKey)) {
            count++;
            if (t.type === 'income') income += Number(t.amount);
            if (t.type === 'expense') expense += Number(t.amount);
          }
        });

        const balance = income - expense;
        const savingRate = income > 0 ? Math.round(((income - expense) / income) * 100) : 0;
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const avgExpensePerDay = daysInMonth > 0 ? Math.round(expense / daysInMonth) : 0;

        return { income, expense, balance, savingRate, count, daysInMonth, avgExpensePerDay };
      }, [transactions, currentMonthKey, currentYear, currentMonth]);

      // All Totals
      const allTotals = useMemo(() => {
        let income = 0;
        let expense = 0;
        transactions.forEach(t => {
          if (t.type === 'income') income += Number(t.amount);
          if (t.type === 'expense') expense += Number(t.amount);
        });
        return { income, expense, balance: income - expense };
      }, [transactions]);

      // Daily transactions map
      const dailyTransactionsMap = useMemo(() => {
        const map = {};
        transactions.forEach(t => {
          if (!map[t.date]) {
            map[t.date] = { income: 0, expense: 0, items: [] };
          }
          if (t.type === 'income') map[t.date].income += Number(t.amount);
          if (t.type === 'expense') map[t.date].expense += Number(t.amount);
          map[t.date].items.push(t);
        });
        return map;
      }, [transactions]);

      // Calendar Days calculation
      const calendarDays = useMemo(() => {
        const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
        const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

        const cells = [];
        for (let i = firstDayOfMonth - 1; i >= 0; i--) {
          cells.push({ day: daysInPrevMonth - i, isCurrentMonth: false, dateString: null });
        }
        for (let day = 1; day <= daysInCurrentMonth; day++) {
          const mStr = String(currentMonth + 1).padStart(2, '0');
          const dStr = String(day).padStart(2, '0');
          const dateString = `${currentYear}-${mStr}-${dStr}`;
          const dayData = dailyTransactionsMap[dateString] || { income: 0, expense: 0, items: [] };
          cells.push({
            day,
            isCurrentMonth: true,
            dateString,
            income: dayData.income,
            expense: dayData.expense,
            count: dayData.items.length
          });
        }
        const remaining = cells.length <= 35 ? 35 - cells.length : 42 - cells.length;
        for (let day = 1; day <= remaining; day++) {
          cells.push({ day, isCurrentMonth: false, dateString: null });
        }
        return { cells, daysInMonth: daysInCurrentMonth };
      }, [currentYear, currentMonth, dailyTransactionsMap]);

      // 5 Months Trends
      const monthlyTrends = useMemo(() => {
        const list = [];
        for (let i = 4; i >= 0; i--) {
          const target = new Date(currentYear, currentMonth - i, 1);
          const y = target.getFullYear();
          const m = target.getMonth();
          const key = `${y}-${String(m + 1).padStart(2, '0')}`;
          let inc = 0, exp = 0;
          transactions.forEach(t => {
            if (t.date && t.date.startsWith(key)) {
              if (t.type === 'income') inc += Number(t.amount);
              if (t.type === 'expense') exp += Number(t.amount);
            }
          });
          list.push({
            key, year: y, month: m,
            label: `${MONTH_NAMES[m].slice(0, 3)}.`,
            income: inc, expense: exp, balance: inc - exp,
            isCurrent: key === currentMonthKey
          });
        }
        return list;
      }, [transactions, currentYear, currentMonth, currentMonthKey]);

      const maxTrendAmount = useMemo(() => {
        let max = 1000;
        monthlyTrends.forEach(t => {
          if (t.income > max) max = t.income;
          if (t.expense > max) max = t.expense;
        });
        return max;
      }, [monthlyTrends]);

      // Month navigators
      const handlePrevMonth = () => {
        setSelectedDate(null);
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(prev => prev - 1);
        } else setCurrentMonth(prev => prev - 1);
      };

      const handleNextMonth = () => {
        setSelectedDate(null);
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(prev => prev + 1);
        } else setCurrentMonth(prev => prev + 1);
      };

      // Filtered transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(item => {
          const matchType = filterType === 'all' || item.type === filterType;
          const matchDate = selectedDate ? item.date === selectedDate : (item.date && item.date.startsWith(currentMonthKey));
          const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.note && item.note.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchType && matchDate && matchSearch;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, filterType, selectedDate, searchQuery, currentMonthKey]);

      // Category breakdown
      const currentMonthCategorySummary = useMemo(() => {
        const map = {};
        transactions
          .filter(t => t.type === 'expense' && t.date && t.date.startsWith(currentMonthKey))
          .forEach(t => {
            map[t.category] = (map[t.category] || 0) + Number(t.amount);
          });
        return Object.keys(map).map(catId => {
          const catInfo = CATEGORIES.expense.find(c => c.id === catId) || { label: catId };
          return {
            id: catId,
            label: catInfo.label,
            amount: map[catId],
            percentage: monthlySummary.expense > 0 ? Math.round((map[catId] / monthlySummary.expense) * 100) : 0
          };
        }).sort((a, b) => b.amount - a.amount);
      }, [transactions, currentMonthKey, monthlySummary.expense]);

      const handleOpenModal = (defaultType = 'expense', targetDate = null) => {
        if (!user && firebaseInitialized) {
          alert('กรุณาเข้าสู่ระบบด้วย Google ก่อนเพื่อซิงค์ข้อมูลลง Cloud ครับ');
          return;
        }
        setFormData({
          type: defaultType,
          title: '',
          amount: '',
          category: defaultType === 'income' ? 'salary' : 'food',
          date: targetDate || selectedDate || `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`,
          note: ''
        });
        setIsModalOpen(true);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.title || !formData.amount || Number(formData.amount) <= 0) {
          alert('กรุณากรอกข้อมูลชื่อรายการและจำนวนเงินให้ถูกต้อง');
          return;
        }

        const newTx = {
          title: formData.title,
          amount: parseFloat(formData.amount),
          type: formData.type,
          category: formData.category,
          date: formData.date,
          note: formData.note || '',
          createdAt: new Date().toISOString()
        };

        if (user && db) {
          // Save directly to Firebase Cloud
          await db.collection('users').doc(user.uid).collection('transactions').add(newTx);
        } else {
          // Offline fallback
          const updated = [{ id: Date.now().toString(), ...newTx }, ...transactions];
          setTransactions(updated);
          localStorage.setItem('money_transactions', JSON.stringify(updated));
        }

        setIsModalOpen(false);
      };

      const handleDelete = async (id) => {
        if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
          if (user && db) {
            await db.collection('users').doc(user.uid).collection('transactions').doc(id).delete();
          } else {
            const updated = transactions.filter(t => t.id !== id);
            setTransactions(updated);
            localStorage.setItem('money_transactions', JSON.stringify(updated));
          }
        }
      };

      const formatBaht = (num) => {
        return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 }).format(num);
      };

      return (
        <div className="min-h-screen pb-16 bg-slate-50/70">
          {/* Header Bar */}
          <header className="glass-effect sticky top-0 z-30 border-b border-slate-200/80 px-4 sm:px-8 py-3.5 shadow-sm">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                  <i data-lucide="cloud" className="w-5 h-5"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-bold bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-800 bg-clip-text text-transparent">
                      FinanceFlow
                    </h1>
                    {/* Sync Indicator */}
                    {user ? (
                      <span className="inline-flex items-center gap-1 text-[10px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full font-medium border border-emerald-200/60">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> ซิงค์ Cloud
                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 text-[10px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-medium border border-amber-200/60">
                        เครื่องนี้ (ยังไม่ซิงค์)
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-slate-500">บันทึกรายรับ-รายจ่าย เชื่อมต่อมือถือ & คอม</p>
                </div>
              </div>

              {/* Month Selector & User Status */}
              <div className="flex items-center gap-2 sm:gap-3 flex-wrap">
                {/* Month Navigator */}
                <div className="flex items-center bg-slate-100/90 border border-slate-200/80 p-1 rounded-2xl shadow-inner">
                  <button onClick={handlePrevMonth} className="p-1.5 rounded-xl hover:bg-white text-slate-600 transition">
                    <i data-lucide="chevron-left" className="w-4 h-4"></i>
                  </button>
                  <span className="px-2 text-xs font-bold text-slate-800 min-w-[110px] text-center">
                    {MONTH_NAMES[currentMonth]} {currentYear + 543}
                  </span>
                  <button onClick={handleNextMonth} className="p-1.5 rounded-xl hover:bg-white text-slate-600 transition">
                    <i data-lucide="chevron-right" className="w-4 h-4"></i>
                  </button>
                </div>

                {/* Google Sign In / User Profile */}
                {user ? (
                  <div className="flex items-center gap-2 bg-white px-2.5 py-1.5 rounded-2xl border border-slate-200 shadow-sm">
                    {user.photoURL ? (
                      <img src={user.photoURL} alt="" className="w-6 h-6 rounded-full" />
                    ) : (
                      <div className="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px]">
                        {user.displayName ? user.displayName[0] : 'U'}
                      </div>
                    )}
                    <span className="text-xs font-medium text-slate-700 max-w-[90px] truncate">{user.displayName || user.email}</span>
                    <button onClick={handleLogout} title="ออกจากระบบ" className="text-slate-400 hover:text-rose-600 ml-1">
                      <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={handleGoogleLogin}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition shadow-sm"
                  >
                    <svg className="w-3.5 h-3.5" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>ล็อกอิน Google</span>
                  </button>
                )}

                {/* Add Transaction Button */}
                <button
                  onClick={() => handleOpenModal('expense')}
                  className="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white shadow-md shadow-indigo-500/25 transition transform active:scale-95"
                >
                  <i data-lucide="plus" className="w-4 h-4"></i>
                  <span className="font-semibold">บันทึกรายการ</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-8 mt-6 space-y-6">

            {/* Guide alert if Firebase Config is not filled */}
            {!firebaseInitialized && (
              <div className="bg-amber-50 border border-amber-200/80 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-amber-900 text-xs">
                <div className="flex items-center gap-2.5">
                  <i data-lucide="info" className="w-5 h-5 text-amber-600 shrink-0"></i>
                  <span>
                    <strong>โหมดใช้งานออฟไลน์:</strong> ปัจจุบันข้อมูลยังบันทึกในเครื่องนี้ เพื่อให้ซิงค์ข้อมูลกับมือถือได้ กรุณานำค่า Config จาก Firebase มาใส่ในไฟล์ <code className="bg-amber-100/80 px-1 py-0.5 rounded font-mono">firebase-config.js</code> ครับ
                  </span>
                </div>
              </div>
            )}
            
            {/* Monthly Highlight Banner */}
            <div className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm relative overflow-hidden">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold mb-2">
                    <i data-lucide="calendar-check" className="w-3.5 h-3.5"></i>

                    >
                      <i data-lucide="arrow-up-right" className="w-4 h-4"></i>
                      <span>รายจ่าย (-)</span>
                    </button>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อรายการ *</label>
                    <input
                      type="text"
                      required
                      placeholder="เช่น ค่าอาหาร, เงินเดือน, ค่าเน็ต"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวนเงิน (บาท) *</label>
                      <input
                        type="number"
                        step="any"
                        required
                        placeholder="0.00"
                        value={formData.amount}
                        onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                        className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">วันที่</label>
                      <input
                        type="date"
                        value={formData.date}
                        onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                        className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">หมวดหมู่</label>
                    <select
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      {CATEGORIES[formData.type].map(c => (
                        <option key={c.id} value={c.id}>{c.label}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">บันทึกเพิ่มเติม</label>
                    <input
                      type="text"
                      placeholder="บันทึกรายละเอียดเพิ่มเติม..."
                      value={formData.note}
                      onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                      className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md transition transform active:scale-95"
                    >
                      บันทึกรายการ
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
